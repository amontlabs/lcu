name: verify-57 (throwaway)

on:
  push:
    branches: [claude/verify-57-windows-d]

permissions:
  contents: read

jobs:
  d-drive:
    name: "ChatGPT on ${{ matrix.volume }}:, LCU ${{ matrix.ref }}"
    strategy:
      fail-fast: false
      matrix:
        include:
          - { ref: main, volume: D }
          - { ref: claude/verify-57-windows-d, volume: D }
          - { ref: claude/verify-57-windows-d, volume: C }
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ matrix.ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Host
        shell: pwsh
        run: |
          Get-ComputerInfo -Property OsName,OsVersion,OsBuildNumber | Format-List
          Get-PSDrive -PSProvider FileSystem | Format-Table Name,Root,Used,Free
          Get-AppxVolume | Format-List
          winget --version
      - name: "Make D: the default AppX volume"
        if: matrix.volume == 'D'
        shell: pwsh
        run: |
          Add-AppxVolume -Path D:\WindowsApps
          Mount-AppxVolume -Volume D:\WindowsApps -ErrorAction SilentlyContinue
          Set-AppxDefaultVolume -Volume D:\WindowsApps
          Get-AppxVolume | Format-List
          Get-AppxDefaultVolume | Format-List
      - name: "Install ChatGPT from the Store"
        shell: pwsh
        run: |
          $agree = @('--accept-package-agreements', '--accept-source-agreements', '--disable-interactivity')
          $ids = @('9PLM9XGG6VKS')
          foreach ($term in 'ChatGPT', 'Codex', 'OpenAI') {
            $out = winget search $term --source msstore --count 25 --accept-source-agreements --disable-interactivity | Out-String
            $out
            $ids += [regex]::Matches($out, '\b(9[A-Z0-9]{11}|XP[A-Z0-9]{12})\b') | ForEach-Object { $_.Value }
          }
          $ids = $ids | Select-Object -Unique
          "candidate ids: $($ids -join ', ')"
          foreach ($id in $ids) {
            winget show --id $id --source msstore --accept-source-agreements --disable-interactivity | Select-Object -First 4
            winget install --id $id --source msstore @agree
            "winget $id exit: $LASTEXITCODE"
            Get-AppxPackage | Where-Object Name -like '*OpenAI*' | Format-Table Name,Version,InstallLocation
            if (Get-AppxPackage -Name OpenAI.Codex) { break }
          }
          $pkg = Get-AppxPackage -Name OpenAI.Codex
          if (-not $pkg) { throw 'OpenAI.Codex is not registered' }
          $pkg | Format-List Name,Version,Architecture,SignatureKind,Status,InstallLocation
          Get-Item -LiteralPath $pkg.InstallLocation | Format-List FullName,Attributes,LinkType,Target
      - name: Build the Windows archive
        shell: pwsh
        run: |
          python scripts/build_bundle.py --platform windows --output "$env:RUNNER_TEMP\dist"
          $zip = (Get-ChildItem "$env:RUNNER_TEMP\dist\*.zip").FullName
          Expand-Archive -LiteralPath $zip -DestinationPath "$env:RUNNER_TEMP\lcu"
          Get-ChildItem "$env:RUNNER_TEMP\lcu"
      - name: Install LCU (runtime only)
        shell: pwsh
        run: |
          $release = (Get-ChildItem "$env:RUNNER_TEMP\lcu" -Directory | Select-Object -First 1).FullName
          powershell -ExecutionPolicy Bypass -File "$release\scripts\install.ps1" --runtime-only --yes
          "install exit: $LASTEXITCODE"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Copy diagnostics
        if: always()
        shell: pwsh
        run: |
          $pkg = Get-AppxPackage -Name OpenAI.Codex
          if (-not $pkg) { exit 0 }
          $real = (Get-Item -LiteralPath $pkg.InstallLocation).Target
          if (-not $real) { $real = $pkg.InstallLocation }
          $node = Join-Path $real 'app\resources\cua_node\bin\node.exe'
          "node: $node"
          Get-Item -LiteralPath $node | Format-List FullName,Length,Attributes
          (Get-Acl -LiteralPath $node).AccessToString
          cipher /c $node
          $dest = Join-Path $env:RUNNER_TEMP 'copy-check'
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          try { Copy-Item -LiteralPath $node -Destination (Join-Path $dest 'ci.exe'); 'Copy-Item: ok' } catch { "Copy-Item: $_" }
          $js = 'const fs=require("fs");const [s,d]=process.argv.slice(1);for(const [n,f] of [["copyFileSync",()=>fs.copyFileSync(s,d+"\\a.exe")],["copyFileSync COPYFILE_FICLONE",()=>fs.copyFileSync(s,d+"\\b.exe",fs.constants.COPYFILE_FICLONE)],["read+write",()=>fs.writeFileSync(d+"\\c.exe",fs.readFileSync(s))]]){try{f();console.log(n+": ok")}catch(e){console.log(n+": "+e.code+" "+e.errno+" "+e.message)}}'
          node -e $js $node $dest
      - name: LCU version and doctor
        shell: pwsh
        run: |
          & "$env:LOCALAPPDATA\LCU\lcu.cmd" --version
          & "$env:LOCALAPPDATA\LCU\lcu.cmd" doctor
          exit 0
