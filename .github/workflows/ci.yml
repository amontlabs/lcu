name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
        python: ['3.12.10']
        include:
          - os: ubuntu-24.04
            python: '3.14'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      # Full history: the Python-vs-Node differentials in tests/compat compare against the frozen 0.9.4 oracle,
      # which tests/blackbox/oracle.py extracts from the commit named in tests/blackbox/BASE.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm ci --prefix adapters --ignore-scripts --no-audit --no-fund
      # Python 3.12.10: the whole suite, including the differentials. They pin CPython 3.12.10's argparse, tar, zip,
      # shlex and Expat behaviour (later 3.12.x patch releases change them), so they run on exactly this version.
      - if: matrix.python == '3.12.10'
        run: python -m unittest discover -b -s tests -p 'test_*.py'
      # Other Pythons: the build and distribution tooling tests only.
      - if: matrix.python != '3.12.10'
        working-directory: tests
        shell: bash
        run: python -m unittest -b $(ls test_*.py | sed 's/\.py$//')
      # LCU's runtime tests. CI has no ChatGPT app, so the suite runs on the Node installed above (the PATH
      # node) only. run-all.sh also adds the app's own Node (cua_node) when it finds one, as a developer machine
      # does; LCU_TEST_NODES pins the list here. Tests that need the app, bubblewrap or root skip themselves.
      # LCU_TEST_PYTHON names the 3.12.10 oracle interpreter for the Python-vs-Node differentials; on the 3.14 job
      # it is unset and they skip themselves with their reason.
      - name: tests/node (PATH Node only)
        shell: bash
        run: |
          if [ "${{ matrix.python }}" = 3.12.10 ]; then export LCU_TEST_PYTHON="$(command -v python)"; fi
          LCU_TEST_NODES="$(command -v node)" tests/node/run-all.sh
      - run: npm test --prefix adapters

  node22:
    # The oldest Node LCU supports (process.execve needs 22.15; the ChatGPT app ships Node 24 today).
    name: tests/node on Node 22 (ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12.10'
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci --prefix adapters --ignore-scripts --no-audit --no-fund
      - name: tests/node (PATH Node only)
        run: LCU_TEST_PYTHON="$(command -v python)" LCU_TEST_NODES="$(command -v node)" tests/node/run-all.sh

  blackbox:
    # The Python 0.9.4 oracle against this tree in the disposable Linux image, network off
    # (tests/blackbox/README.md). Accepted differences are the reviewed list in tests/blackbox/deviations.json.
    name: Black-box differential (linux/amd64)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: tests/blackbox/docker.sh --runs 2 --deviations /src/tests/blackbox/deviations.json
      - run: tests/blackbox/docker.sh --root --runs 2 --deviations /src/tests/blackbox/deviations.json

  windows:
    # Modules and tests for POSIX-only targets (Linux/macOS installers and
    # layouts, fcntl, mode bits, Unix sockets) skip themselves on Windows.
    name: Windows build and tests
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      # The repository's bytes, not the runner's autocrlf rewrite: shell scripts, JSON and hashed files are LF.
      - run: git config --global core.autocrlf false
      # Full history: tests/node differentials extract the frozen 0.9.4 oracle from the commit named in
      # tests/blackbox/BASE (see the `unit` job).
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12.10'
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm ci --prefix adapters --ignore-scripts --no-audit --no-fund
      # The build and distribution tooling tests; the Node-vs-Python differentials (tests/compat) run in `unit`.
      - working-directory: tests
        shell: bash
        run: python -m unittest -b $(ls test_*.py | sed 's/\.py$//')
      - run: npm test --prefix adapters
      # Fixture tests of the Windows runtime, not live Windows evidence. Required: tests that cannot run on Windows
      # skip themselves with a specific reason (tests/node/windows_skip.mjs; classification in
      # .port/notes/windows-tests.md).  .github/workflows/windows-node.yml runs just this step for quick iteration.
      - name: tests/node (PATH Node only)
        shell: bash
        # The Python oracles print UTF-8 like they do on the Linux runners (not the console code page).
        env:
          PYTHONUTF8: '1'
        run: LCU_TEST_PYTHON="$(command -v python)" LCU_TEST_NODES="$(command -v node)" tests/node/run-all.sh
      - run: python scripts/build_bundle.py --platform windows --output "$env:RUNNER_TEMP\dist"
      - run: python scripts/check_archive.py (Get-ChildItem "$env:RUNNER_TEMP\dist\*.zip").FullName

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      # Bug-class rules only (syntax errors, undefined names); style is not gated.
      - run: pipx run ruff check --isolated --select E9,F63,F7,F82 .
      - run: git ls-files -z '*.sh' | xargs -0 shellcheck --severity=error
      - name: JavaScript modules parse
        run: git ls-files -z '*.mjs' '*.cjs' | xargs -0 -n1 node --check
      - name: JSON files parse
        run: git ls-files '*.json' ':!:**/package-lock.json' | xargs -n1 python3 -m json.tool --no-ensure-ascii > /dev/null

  archives:
    name: Build archives and check for app payloads
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12.10'
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      # build_bundle.py smoke-tests the archive on the PATH Node (build time only; the installed runtime
      # always runs on the ChatGPT app's own Node).
      - run: python scripts/build_bundle.py --platform linux --output "$RUNNER_TEMP/dist"
      - run: python scripts/build_bundle.py --platform windows --output "$RUNNER_TEMP/dist"
      - run: python scripts/check_archive.py "$RUNNER_TEMP"/dist/*.tar.gz "$RUNNER_TEMP"/dist/*.zip
